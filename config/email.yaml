  - ettorezauli@gmail.com

subject_prefix: "[gCASTEL LI]"
processed_folder: "INBOX.LinkedIn"   # le mail gestite vengono spostate qui (crearla se manca)

# Tag di oggetto per le mail che Ettore invia di sua iniziativa
intake_tags:
  REPORT: "report o articolo da commentare (allegato PDF o link)"
  FEATURE: "nuova funzionalità rilasciata"
  EVENTO: "partecipazione a un evento"
  PARTNERSHIP: "annuncio di partnership"
  IDEA: "idea libera per un post"
  ANALYTICS: "screenshot delle statistiche"
  GILBERTO: "spunto per un post del profilo di Gilberto"

attachments:
  preview_max_kb: 70   # anteprime JPEG nelle bozze (inline + allegato)
